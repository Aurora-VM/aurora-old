name: Aurora Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Go Backend Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.21.x', '1.22.x' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Protoc & Plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Check Protobuf Generation Up-To-Date
        run: |
          make proto
          git diff --exit-code gen/go

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Go Unit Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Server Binary
        run: go build -v ./cmd/aurora-server

      - name: Build Node Agent Binary
        run: go build -v ./cmd/aurora-agent

  frontend-checks:
    name: React Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./web
        run: npm run test

      - name: TypeCheck and Build Frontend
        working-directory: ./web
        run: npm run build
