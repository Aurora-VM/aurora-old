syntax = "proto3";

package aurora.v1;

option go_package = "github.com/aurora-vm/aurora/gen/go/aurora/v1;aurorav1";

// Standard status enum across Aurora subsystems.
enum SystemStatus {
  SYSTEM_STATUS_UNSPECIFIED = 0;
  SYSTEM_STATUS_HEALTHY = 1;
  SYSTEM_STATUS_DEGRADED = 2;
  SYSTEM_STATUS_UNHEALTHY = 3;
}

// Request pagination parameters.
message PaginationRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// Response pagination metadata.
message PaginationResponse {
  string next_page_token = 1;
  int64 total_items = 2;
}

// Key-value label pair for metadata tagging.
message LabelPair {
  string key = 1;
  string value = 2;
}
